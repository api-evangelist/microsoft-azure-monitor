naftiko: 1.0.0-alpha2
info:
  label: Azure Monitor Azure Application Insights API — Query
  description: 'Azure Monitor Azure Application Insights API — Query. 2 operations. Lead operation: Azure Monitor Execute
    an Application Insights query via GET. Self-contained Naftiko capability covering one Microsoft Azure Monitor business
    surface.'
  tags:
  - Microsoft Azure Monitor
  - Query
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_AZURE_MONITOR_API_KEY: MICROSOFT_AZURE_MONITOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: azure-monitor-application-insights-query
    baseUri: https://api.applicationinsights.io/v1
    description: Azure Monitor Azure Application Insights API — Query business capability. Self-contained, no shared references.
    resources:
    - name: apps-appId-query
      path: /apps/{appId}/query
      operations:
      - name: queryget
        method: GET
        description: Azure Monitor Execute an Application Insights query via GET
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: query
          in: query
          type: string
          description: The Analytics query in KQL format.
          required: true
        - name: timespan
          in: query
          type: string
          description: The timespan over which to query data in ISO 8601 duration format.
      - name: queryexecute
        method: POST
        description: Azure Monitor Execute an Application Insights query via POST
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_AZURE_MONITOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: azure-monitor-application-insights-query-rest
    port: 8080
    description: REST adapter for Azure Monitor Azure Application Insights API — Query. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/apps/{appid}/query
      name: apps-appid-query
      description: REST surface for apps-appId-query.
      operations:
      - method: GET
        name: queryget
        description: Azure Monitor Execute an Application Insights query via GET
        call: azure-monitor-application-insights-query.queryget
        with:
          query: rest.query
          timespan: rest.timespan
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: queryexecute
        description: Azure Monitor Execute an Application Insights query via POST
        call: azure-monitor-application-insights-query.queryexecute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: azure-monitor-application-insights-query-mcp
    port: 9090
    transport: http
    description: MCP adapter for Azure Monitor Azure Application Insights API — Query. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: azure-monitor-execute-application-insights
      description: Azure Monitor Execute an Application Insights query via GET
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: azure-monitor-application-insights-query.queryget
      with:
        query: tools.query
        timespan: tools.timespan
      outputParameters:
      - type: object
        mapping: $.
    - name: azure-monitor-execute-application-insights-2
      description: Azure Monitor Execute an Application Insights query via POST
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: azure-monitor-application-insights-query.queryexecute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
