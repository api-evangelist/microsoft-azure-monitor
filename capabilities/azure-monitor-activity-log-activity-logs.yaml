    resources:
    - name: subscriptions-subscriptionId-providers-Microsoft.Insights-eventtypes-management-
      path: /subscriptions/{subscriptionId}/providers/Microsoft.Insights/eventtypes/management/values
      operations:
      - name: activitylogslist
        method: GET
        description: Azure Monitor List Activity Log events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $filter
          in: query
          type: string
          description: Reduces the set of data collected. Must include a time range filter using eventTimestamp. Supports
